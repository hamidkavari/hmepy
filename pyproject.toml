[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hmepy"
version = "1.7.0"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "requests",
    "importlib-metadata",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["hmepy"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]